<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>툰뷰어</title>
<style>
  :root {
    --bg: #f6f4f0; --surface: #ffffff; --surface-2: #efece6; --line: #e4e0d8; --text: #1c1b19; --muted: #86817a;
    --accent: #e8590c; --accent-soft: #ffe9dc; --accent-text: #ffffff; --ok: #2b8a3e; --shadow: 0 6px 18px rgba(40,30,15,.10);
    --cover-bg: #ddd8cf;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141312; --surface: #1d1c1a; --surface-2: #262522; --line: #312f2b; --text: #f1eee8; --muted: #9a958c;
      --accent: #ff7a2e; --accent-soft: #3a2416; --accent-text: #1a0f08; --ok: #5cc777; --shadow: 0 6px 18px rgba(0,0,0,.35);
      --cover-bg: #2b2a27;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.5 -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    letter-spacing: -0.01em; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .view { display: none; min-height: 100vh; }
  .view.on { display: block; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }

  /* 상단 바 */
  .top { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 14px 0 10px; }
  .top .wrap { display: flex; align-items: center; gap: 8px; }
  .top h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn svg { width: 22px; height: 22px; }
  .spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search { margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; background: var(--surface-2);
    border-radius: 12px; padding: 0 12px; }
  .search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; color: var(--text); font: inherit; padding: 11px 0; outline: none; }

  h2.sec { font-size: 16px; margin: 18px 0 10px; display: flex; align-items: center; justify-content: space-between; }
  h2.sec small { color: var(--muted); font-weight: 600; font-size: 13px; }

  /* 이어 보기 줄 */
  .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .row::-webkit-scrollbar { display: none; }
  .cont { flex: none; width: 260px; display: flex; gap: 12px; background: var(--surface); border-radius: 16px; padding: 10px;
    box-shadow: var(--shadow); text-align: left; align-items: center; }
  .cont .cv { width: 66px; flex: none; border-radius: 10px; }
  .cont b { display: block; font-size: 15px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cont span { color: var(--muted); font-size: 13px; }
  .cont .meta { min-width: 0; flex: 1; }
  .pbar { height: 4px; border-radius: 9px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
  .pbar i { display: block; height: 100%; background: var(--accent); border-radius: 9px; }

  /* 표지 */
  .cv { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: var(--cover-bg); }
  .cv .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; font-weight: 800; color: var(--muted); }
  .cv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }

  /* 전체 작품 */
  .chips { display: flex; gap: 6px; }
  .chip { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .chip.on { background: var(--text); color: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px; padding-bottom: 40px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .card { text-align: left; min-width: 0; }
  .card .cv { box-shadow: var(--shadow); }
  .card b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 14px; line-height: 1.3; margin-top: 8px; word-break: keep-all; overflow-wrap: anywhere; }
  .card span { color: var(--muted); font-size: 12px; }
  .badge { position: absolute; left: 6px; top: 6px; background: var(--accent); color: var(--accent-text); font-size: 11px;
    font-weight: 800; padding: 2px 7px; border-radius: 99px; }
  .card .pbar { margin-top: 6px; }

  .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
  .empty svg { width: 64px; height: 64px; color: var(--accent); }
  .empty h3 { color: var(--text); font-size: 18px; margin: 14px 0 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 20px; border-radius: 14px;
    background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 15px; }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn:active { filter: brightness(.95); }
  .notice { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; display: none; }
  .notice.on { display: block; }

  /* 작품 화면 */
  .hero { position: relative; overflow: hidden; padding: 8px 0 18px; }
  .hero .bgimg { position: absolute; inset: -40px; background-size: cover; background-position: top; filter: blur(30px) saturate(1.2); opacity: .35; }
  .hero .wrap { position: relative; display: flex; gap: 16px; align-items: flex-end; }
  .hero .cv { width: 112px; flex: none; box-shadow: var(--shadow); }
  .hero h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.25; word-break: keep-all; overflow-wrap: anywhere; }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; }
  .actions { display: flex; gap: 8px; margin: 4px 0 8px; }
  .actions .btn { flex: 1; padding: 13px 10px; }
  .eps { list-style: none; margin: 0; padding: 0 0 40px; }
  .eps li { display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid var(--line); }
  .eps li:active { background: var(--surface-2); }
  .eps .n { flex: none; min-width: 52px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .eps .t { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eps .st { flex: none; font-size: 12px; font-weight: 700; color: var(--muted); }
  .eps li.read .n { color: var(--muted); font-weight: 600; }
  .eps li.cur .n, .eps li.cur .st { color: var(--accent); }

  /* 보기 화면 */
  #reader { background: #000; }
  #pages { max-width: 800px; margin: 0 auto; min-height: 100vh; }
  #pages img { display: block; width: 100%; height: auto; min-height: 120px; background: #111; }
  #pages img.loaded { min-height: 0; background: none; }
  .rbar { position: fixed; left: 0; right: 0; z-index: 20; background: rgba(20,19,18,.94); color: #f1eee8;
    transition: transform .2s; backdrop-filter: blur(8px); }
  .rtop { top: 0; padding: calc(env(safe-area-inset-top) + 6px) 8px 6px; display: flex; align-items: center; gap: 6px; }
  .rtop .ttl { flex: 1; min-width: 0; }
  .rtop .ttl b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rtop .ttl span { font-size: 12px; color: #9a958c; }
  .rbot { bottom: 0; padding: 8px 12px calc(env(safe-area-inset-bottom) + 10px); display: flex; align-items: center; gap: 10px; }
  .rbot .mid { flex: 1; text-align: center; font-size: 13px; color: #c9c4bb; font-variant-numeric: tabular-nums; }
  .rbot .nav { padding: 10px 14px; border-radius: 12px; background: #2a2926; font-weight: 700; font-size: 14px; }
  .rbot .nav:disabled { opacity: .35; }
  .rprog { position: fixed; left: 0; top: 0; height: 3px; background: var(--accent); z-index: 25; width: 0; }
  #reader.hide .rtop { transform: translateY(-110%); }
  #reader.hide .rbot { transform: translateY(110%); }
  .endcard { color: #f1eee8; text-align: center; padding: 50px 20px 140px; }
  .endcard p { color: #9a958c; margin: 0 0 16px; }
  .endcard .btn { min-width: 220px; }
  .loading { color: #9a958c; text-align: center; padding: 40vh 0 0; }

  /* 설정 */
  .folders { list-style: none; padding: 0; margin: 0 0 14px; }
  .folders li { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .folders li span { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
  .help { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .help b { color: var(--text); }
  .danger { color: #d64545; font-weight: 700; font-size: 14px; padding: 10px 0; }
</style>
</head>
<body>

<!-- 서재 -->
<section class="view" id="lib">
  <div class="top"><div class="wrap">
    <h1>내 서재</h1>
    <button class="icon-btn" id="btnScan" aria-label="새로고침">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
  </div></div>
  <div class="wrap">
    <div class="notice" id="scanNote">새로 받은 파일을 찾는 중…</div>
    <div id="libBody"></div>
  </div>
</section>

<!-- 작품 -->
<section class="view" id="ser">
  <div class="top"><div class="wrap">
    <button class="icon-btn" data-back aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 id="serTop" style="font-size:17px"></h1>
  </div></div>
  <div id="serBody"></div>
</section>

<!-- 보기 -->
<section class="view" id="reader">
  <div class="rprog" id="rprog"></div>
  <div class="rbar rtop">
    <button class="icon-btn" data-back aria-label="목록으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="ttl"><b id="rTitle"></b><span id="rSub"></span></div>
  </div>
  <div id="pages"></div>
  <div class="rbar rbot">
    <button class="nav" id="rPrev">‹ 이전화</button>
    <div class="mid" id="rPct">0%</div>
    <button class="nav" id="rNext">다음화 ›</button>
  </div>
</section>

<!-- 설정 -->
<section class="view" id="set">
  <div class="top"><div class="wrap">
    <button class="icon-btn" data-back aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 style="font-size:17px">폴더 설정</h1>
  </div></div>
  <div class="wrap">
    <h2 class="sec">불러오는 폴더</h2>
    <ul class="folders" id="folders"></ul>
    <button class="btn" id="btnAdd" style="width:100%">＋ 폴더 추가</button>
    <p class="help" style="margin-top:18px">
      · 받은 웹툰이 있는 폴더를 고르세요. 보통 <b>Download</b> 폴더를 고르면 됩니다.<br>
      · <b>작품 폴더 / 회차 폴더 / 이미지</b>, 또는 <b>회차별 ZIP</b> 모두 자동으로 정리돼요.<br>
      · 새로 받은 화가 안 보이면 서재에서 <b>새로고침</b>을 누르세요.
    </p>
    <h2 class="sec">기록</h2>
    <button class="danger" id="btnReset">읽은 기록 모두 지우기</button>
  </div>
</section>

<script>
'use strict';
// ---------------------------------------------------------------- Java 연결
const cbs = {};
let seq = 0;
window.__cb = (id, json) => { const f = cbs[id]; delete cbs[id]; if (f) f(JSON.parse(json)); };
const call = (m, a) => new Promise((res) => { const id = String(++seq); cbs[id] = res; Android.call(m, a || '', id); });
const native = (fn, ...args) => { try { Android[fn](...args); } catch (e) { /* 브라우저 테스트용 */ } };

// ---------------------------------------------------------------- 저장 (읽은 기록)
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 무시 */ } },
};
let progress = store.get('tv.progress', {});   // 작품id → {ep, num, name, ratio, t}
let readSet = store.get('tv.read', {});        // 회차id → 읽은 시각
const prefs = store.get('tv.prefs', { sort: 'recent', epOrder: 'asc' });
const savePrefs = () => store.set('tv.prefs', prefs);

// ---------------------------------------------------------------- 유틸
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const coverHtml = (sid, name, cls) =>
  `<div class="cv ${cls || ''}"><div class="ph">${esc((name || '?').trim().charAt(0))}</div>` +
  `<img src="/cover?s=${encodeURIComponent(sid)}" alt="" loading="lazy" onerror="this.remove()"></div>`;
function shortEpName(name, series) {
  let s = name.replace(/^\d{2,}\s+/, '');
  if (series && s.startsWith(series)) s = s.slice(series.length);
  return s.replace(/^[\s\-_:|]+/, '').trim() || name;
}
const epLabel = (ep) => ep.num ? ep.num + '화' : shortEpName(ep.name, '');

// ---------------------------------------------------------------- 화면 이동 (#/ , #/s/작품, #/r/회차, #/set)
let lib = null;   // 목록을 불러오기 전
function go(h) { location.hash = h; }
function show(id) {
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === id));
  if (id !== 'reader') { native('immersive', false); $('reader').classList.remove('hide'); }
}
window.addEventListener('hashchange', route);
function route() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [, a, b] = h.split('/');
  if (a === 's' && b) return openSeries(decodeURIComponent(b));
  if (a === 'r' && b) return openReader(decodeURIComponent(b));
  if (a === 'set') return openSettings();
  show('lib');
  renderLib();
}
// 안드로이드 뒤로가기: 보기 → 작품 → 서재 → 앱 종료
window.appBack = () => {
  const h = location.hash.replace(/^#/, '') || '/';
  const [, a] = h.split('/');
  if (a === 'r') { saveProgress(); location.replace(cur ? '#/s/' + encodeURIComponent(cur.seriesId) : '#/'); return true; }
  if (a === 's' || a === 'set') { location.replace('#/'); return true; }
  return false;
};
document.querySelectorAll('[data-back]').forEach((b) => b.addEventListener('click', () => window.appBack()));

// ---------------------------------------------------------------- 서재
let scanned = false;
async function loadLibrary(scan) {
  const r = await call('library', scan ? 'scan' : '');
  if (r && !r.error) lib = r;
  if (!document.querySelector('#lib.on') && scan) return;
  renderLib();
}
async function rescan() {
  $('btnScan').classList.add('spin');
  $('scanNote').classList.add('on');
  await loadLibrary(true);
  $('btnScan').classList.remove('spin');
  $('scanNote').classList.remove('on');
  scanned = true;
}
$('btnScan').addEventListener('click', rescan);
$('btnSettings').addEventListener('click', () => go('/set'));

function seriesStats(s) {
  const read = s.eps.reduce((n, id) => n + (readSet[id] ? 1 : 0), 0);
  return { read, pct: s.count ? Math.round(read / s.count * 100) : 0 };
}

function renderLib() {
  const body = $('libBody');
  if (!lib) { body.innerHTML = '<div class="empty"><p>불러오는 중…</p></div>'; return; }
  if (!lib.roots) {
    body.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c3-1.5 6.5-1.5 10 1v13c-3.5-2.5-7-2.5-10-1z"/><path d="M22 6c-3-1.5-6.5-1.5-10 1v13c3.5-2.5 7-2.5 10-1z"/></svg>
      <h3>서재가 비어 있어요</h3>
      <p>받은 웹툰이 있는 폴더를 골라주세요.<br>보통 <b>Download</b> 폴더예요.</p>
      <button class="btn" id="emptyAdd">＋ 폴더 고르기</button></div>`;
    $('emptyAdd').onclick = () => native('pickFolder');
    return;
  }
  const q = ($('q') && $('q').value || '').trim().toLowerCase();
  const recent = Object.entries(progress)
    .map(([sid, p]) => ({ s: lib.series.find((x) => x.id === sid), p }))
    .filter((x) => x.s).sort((a, b) => b.p.t - a.p.t).slice(0, 10);

  let list = lib.series.filter((s) => !q || s.name.toLowerCase().includes(q));
  if (prefs.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  else if (prefs.sort === 'added') list.sort((a, b) => b.mtime - a.mtime);
  else list.sort((a, b) => ((progress[b.id] || {}).t || 0) - ((progress[a.id] || {}).t || 0) || b.mtime - a.mtime);

  const keepQ = $('q') ? $('q').value : '';
  body.innerHTML = `
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="작품 검색" autocomplete="off"></label>
    ${recent.length && !q ? `<h2 class="sec">이어 보기</h2><div class="row">${recent.map(({ s, p }) => `
      <button class="cont" data-ep="${esc(p.ep)}">${coverHtml(s.id, s.name)}
        <div class="meta"><b>${esc(s.name)}</b><span>${esc(p.num ? p.num + '화' : '')} · ${Math.round((p.ratio || 0) * 100)}%</span>
        <div class="pbar"><i style="width:${Math.round((p.ratio || 0) * 100)}%"></i></div></div></button>`).join('')}</div>` : ''}
    <h2 class="sec">전체 작품 <small>${list.length}</small></h2>
    <div class="chips" style="margin:-2px 0 14px">
      ${[['recent', '최근 본'], ['added', '최근 받은'], ['name', '이름순']].map(([k, t]) =>
        `<button class="chip ${prefs.sort === k ? 'on' : ''}" data-sort="${k}">${t}</button>`).join('')}
    </div>
    ${list.length ? `<div class="grid">${list.map((s) => {
      const st = seriesStats(s);
      return `<button class="card" data-s="${esc(s.id)}">${coverHtml(s.id, s.name)}
        <b>${esc(s.name)}</b><span>${s.count}화${st.read ? ' · ' + st.read + '화 읽음' : ''}</span>
        ${st.read ? `<div class="pbar"><i style="width:${st.pct}%"></i></div>` : ''}</button>`;
    }).join('')}</div>` : `<div class="empty"><h3>${q ? '검색 결과가 없어요' : '아직 웹툰이 없어요'}</h3>
      <p>${q ? '' : '고른 폴더에 받은 웹툰이 없거나 아직 찾는 중이에요.<br>새로고침을 눌러보세요.'}</p></div>`}`;
  const qi = $('q');
  qi.value = keepQ;
  if (keepQ) { qi.focus(); qi.setSelectionRange(keepQ.length, keepQ.length); }
  qi.addEventListener('input', renderLib);
  body.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => go('/s/' + encodeURIComponent(b.dataset.s)));
  body.querySelectorAll('[data-ep]').forEach((b) => b.onclick = () => go('/r/' + encodeURIComponent(b.dataset.ep)));
  body.querySelectorAll('[data-sort]').forEach((b) => b.onclick = () => { prefs.sort = b.dataset.sort; savePrefs(); renderLib(); });
}

// ---------------------------------------------------------------- 작품
async function openSeries(sid) {
  show('ser');
  $('serBody').innerHTML = '<div class="loading" style="padding-top:30vh">불러오는 중…</div>';
  const s = await call('series', sid);
  if (!s) { $('serBody').innerHTML = '<div class="empty"><h3>작품을 찾을 수 없어요</h3></div>'; return; }
  $('serTop').textContent = '';
  const p = progress[sid];
  const read = s.eps.filter((e) => readSet[e.id]).length;
  const contEp = p && s.eps.find((e) => e.id === p.ep);
  const firstUnread = s.eps.find((e) => !readSet[e.id]);
  const resume = contEp || firstUnread || s.eps[0];
  const eps = prefs.epOrder === 'desc' ? s.eps.slice().reverse() : s.eps;

  $('serBody').innerHTML = `
    <div class="hero"><div class="bgimg" style="background-image:url('/cover?s=${encodeURIComponent(sid)}')"></div>
      <div class="wrap">${coverHtml(sid, s.name)}
        <div><h1>${esc(s.name)}</h1><p>${s.eps.length}화 · ${read}화 읽음</p></div></div></div>
    <div class="wrap">
      <div class="actions">
        ${resume ? `<button class="btn" data-ep="${esc(resume.id)}">${contEp ? '이어 보기' : (read ? '다음 화 보기' : '첫 화 보기')} · ${esc(epLabel(resume))}</button>` : ''}
        ${s.eps.length && contEp ? `<button class="btn ghost" data-ep="${esc(s.eps[0].id)}">처음부터</button>` : ''}
      </div>
      <h2 class="sec">회차 <button class="chip on" id="epOrder">${prefs.epOrder === 'desc' ? '최신화부터' : '1화부터'}</button></h2>
      <ul class="eps">${eps.map((e) => {
        const isCur = p && p.ep === e.id;
        const st = isCur ? Math.round((p.ratio || 0) * 100) + '%' : (readSet[e.id] ? '읽음' : '');
        return `<li data-ep="${esc(e.id)}" class="${readSet[e.id] ? 'read' : ''} ${isCur ? 'cur' : ''}">
          <span class="n">${esc(epLabel(e))}</span><span class="t">${esc(shortEpName(e.name, s.name))}</span><span class="st">${st}</span></li>`;
      }).join('')}</ul>
    </div>`;
  $('serBody').querySelectorAll('[data-ep]').forEach((b) => b.onclick = () => go('/r/' + encodeURIComponent(b.dataset.ep)));
  $('epOrder').onclick = () => { prefs.epOrder = prefs.epOrder === 'desc' ? 'asc' : 'desc'; savePrefs(); openSeries(sid); };
  const curLi = $('serBody').querySelector('li.cur');
  if (curLi) curLi.scrollIntoView({ block: 'center' });
  else window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- 보기
let cur = null, saveTimer = 0, restoring = false, pagesReady = false;
async function openReader(eid) {
  show('reader');
  pagesReady = false;
  window.scrollTo(0, 0);
  $('pages').innerHTML = '<div class="loading">불러오는 중…</div>';
  $('rTitle').textContent = ''; $('rSub').textContent = '';
  const e = await call('episode', eid);
  if (!e || e.error) { $('pages').innerHTML = `<div class="loading">열 수 없어요${e && e.error ? '<br>' + esc(e.error) : ''}</div>`; return; }
  cur = e;
  $('rTitle').textContent = e.seriesName;
  $('rSub').textContent = `${epLabel(e)} · ${e.index + 1} / ${e.total}`;
  $('rPrev').disabled = !e.prev;
  $('rNext').disabled = !e.next;

  const imgs = [];
  for (let i = 0; i < e.count; i++) imgs.push(`<img src="/img?ep=${encodeURIComponent(e.id)}&i=${i}" alt="" decoding="async">`);
  $('pages').innerHTML = imgs.join('') + `<div class="endcard">
    <p>${esc(e.seriesName)} ${esc(epLabel(e))} 끝</p>
    ${e.next ? '<button class="btn" id="endNext">다음 화 보기 ›</button>' : '<p style="color:#f1eee8">마지막 화예요 🎉</p>'}
    <div style="margin-top:12px"><button class="btn ghost" id="endList" style="background:#2a2926;color:#f1eee8">목록으로</button></div></div>`;
  if (e.next) $('endNext').onclick = () => go('/r/' + encodeURIComponent(e.next));
  $('endList').onclick = () => window.appBack();

  // 이어 보던 위치로 이동 (이미지 크기가 정해진 뒤)
  const p = progress[e.seriesId];
  const ratio = p && p.ep === e.id && !readSet[e.id] ? p.ratio || 0 : 0;
  const els = Array.from($('pages').querySelectorAll('img'));
  restoring = ratio > 0.01;
  const done = Promise.all(els.map((im) => new Promise((r) => {
    const fin = () => { im.classList.add('loaded'); r(); };
    if (im.complete) fin(); else { im.onload = fin; im.onerror = fin; }
  })));
  done.then(() => { if (cur === e) pagesReady = true; });
  if (restoring) {
    await Promise.race([done, new Promise((r) => setTimeout(r, 5000))]);
    if (cur === e) window.scrollTo(0, ratio * (document.documentElement.scrollHeight - innerHeight));
    restoring = false;
  }
  saveProgress();
}
$('rPrev').onclick = () => cur && cur.prev && go('/r/' + encodeURIComponent(cur.prev));
$('rNext').onclick = () => cur && cur.next && go('/r/' + encodeURIComponent(cur.next));

function ratioNow() {
  const max = document.documentElement.scrollHeight - innerHeight;
  return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}
function saveProgress() {
  if (!cur || restoring || !document.querySelector('#reader.on')) return;
  const r = ratioNow();
  progress[cur.seriesId] = { ep: cur.id, num: cur.num, name: cur.name, ratio: r, t: Date.now() };
  store.set('tv.progress', progress);
  // 끝까지 보면 읽음 표시 (이미지가 다 뜬 뒤, 실제로 내려봤을 때만)
  const end = document.querySelector('.endcard');
  if (pagesReady && scrollY > 0 && (r > 0.97 || (end && end.getBoundingClientRect().top < innerHeight * 0.8))) {
    if (!readSet[cur.id]) { readSet[cur.id] = Date.now(); store.set('tv.read', readSet); }
  }
}

let lastY = 0;
window.addEventListener('scroll', () => {
  if (!document.querySelector('#reader.on')) return;
  const y = scrollY;
  $('rprog').style.width = (ratioNow() * 100) + '%';
  $('rPct').textContent = Math.round(ratioNow() * 100) + '%';
  // 내리면 메뉴 숨기기, 올리면 보이기
  if (Math.abs(y - lastY) > 12) {
    const hide = y > lastY && y > 80;
    $('reader').classList.toggle('hide', hide);
    native('immersive', hide);
    lastY = y;
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProgress, 600);
}, { passive: true });
$('pages').addEventListener('click', (ev) => {
  if (ev.target.closest('button')) return;
  const hide = !$('reader').classList.contains('hide');
  $('reader').classList.toggle('hide', hide);
  native('immersive', hide);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });

// ---------------------------------------------------------------- 설정
async function openSettings() {
  show('set');
  const roots = await call('roots');
  $('folders').innerHTML = roots.length ? roots.map((r) => `<li><span>📁 ${esc(r.name)}</span>
    <button class="icon-btn" data-rm="${esc(r.uri)}" aria-label="삭제">✕</button></li>`).join('')
    : '<li><span style="color:var(--muted)">아직 고른 폴더가 없어요</span></li>';
  $('folders').querySelectorAll('[data-rm]').forEach((b) => b.onclick = async () => {
    if (!confirm('이 폴더를 서재에서 뺄까요? (파일은 지워지지 않아요)')) return;
    native('removeFolder', b.dataset.rm);
    await loadLibrary(true);
    openSettings();
  });
}
$('btnAdd').onclick = () => native('pickFolder');
window.onFolderPicked = async (ok) => {
  if (!ok) return;
  location.replace('#/');
  await rescan();
};
$('btnReset').onclick = () => {
  if (!confirm('읽은 기록과 이어보기 위치를 모두 지울까요?')) return;
  progress = {}; readSet = {};
  store.set('tv.progress', progress); store.set('tv.read', readSet);
  alert('지웠어요.');
};

// ---------------------------------------------------------------- 시작
(async () => {
  route();
  await loadLibrary(false);      // 저장해 둔 목록을 먼저 바로 보여주고
  if (!scanned && lib && lib.roots) rescan();   // 새로 받은 파일은 뒤에서 찾기
})();
</script>
