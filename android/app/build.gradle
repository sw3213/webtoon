plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sw3213.toonviewer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sw3213.toonviewer'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // 고정 키: 새 버전을 설치해도 지우지 않고 바로 업데이트되도록 (개인용 앱)
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
